schema_version = "3.6.0"
scientific_protocol = "multi-coverage-protection/v1"

[experiment]
name = "m12_resnet8_fkeras_paired_precision_v1"
description = "Prespecified new-field FKeras comparison conditional on the previously exposed fixed 1000-image CIFAR-10 cohort and checkpoint; not independent input or model confirmation."
objective = "Estimate paired cross-entropy differences for published-form FKeras versus MSB and per-example absolute gradient at two partial-tier budgets and two prespecified BERs."

[benchmark]
adapter = "mlperf_tiny_ic_int8_v1"
id = "mlperf_tiny_ic_resnet8_int8_v1"
checkpoint = "/data/models/models--mlcommons--tiny/blobs/3c002613d1b2475eb51dd78dfb85a546c8ae658dee71cf6ade43b022fe205415"
dataset = "/data/datasets/cifar10/cifar-10-python.tar.gz"
asset_lock = "/projects/kona-assets/manuelbv/locks/mlperf-tiny/ic.lock.json"
inference_backend = "tensorflow_lite_builtin_ref_v1"
split = "test"
quantization = "tflite_affine_int8"
quantization_backend = "tflite_affine_integer_v1"
injectable_parameters = ["kernels"]

[samples]
ranking_count = 64
empirical_count = 1
evaluation_count = 1000
require_disjoint = true

[candidates]
strategy = "uniform"
count = 1
seed = 3122101
score_quantiles = 1

[[estimators]]
name = "msb_first"
implementation_version = "relative-word-bit-index/v1"
result_name = "s2_msb_first"

[[estimators]]
name = "per_sample_first_order_magnitude"
implementation_version = "mean-absolute-per-example-gradient-times-exact-delta/v1"
result_name = "s5_per_example_absolute"

[[estimators]]
name = "fkeras_paper"
implementation_version = "fkeras-paper-continuous-resnet8/v1"
seed = 1208102
hessian = {eigenpairs = 2, max_iterations = 100, max_products = 150, tolerance = 0.00001, ordering = "largest_magnitude_signed"}

[[policies]]
name = "msb_global"
estimator = "s2_msb_first"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true

[[policies]]
name = "per_example_absolute_global"
estimator = "s5_per_example_absolute"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true

[[policies]]
name = "fkeras_paper"
estimator = "fkeras_paper"
priority = ["bit_significance_desc", "estimator_score_desc", "stable_identity"]
prespecified = true

[protection]
coverages = [0.0625, 0.1875]
probabilities = [0.003, 0.01]
mitigation_model = "perfect_event_suppression"

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probability = 0.003

[execution]
trials = 320
confidence = 0.95
fault_seed = 3122201
permutation_seed = 3122301

[replications]
count = 1
candidate_seed_stride = 0
hutchinson_seed_stride = 0
sample_offset_stride = 0
fault_seed_stride = 0
estimator_seed_stride = 0

[output]
root = ""
report = true
plots = false

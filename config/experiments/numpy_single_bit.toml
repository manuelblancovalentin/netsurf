schema_version = "3.0.0"
scientific_protocol = "single-bit-susceptibility/v1"
policies = []

[experiment]
name = "numpy_reference_single_bit"
description = "Exhaustive exact susceptibility of all 102 bits in the NumPy reference network."
objective = "Validate finite encoded-bit effects and local estimator approximations on a tractable model."

[benchmark]
adapter = "numpy_reference"
id = "numpy_reference_dense_2x3x2-v1"
checkpoint = "../../netsurf/benchmarks/data/numpy_reference_checkpoint.json"
dataset = "../../netsurf/benchmarks/data/numpy_reference_dataset.json"
split = "m3_explicit_disjoint_partitions"
quantization = "q<6,2,1>"
quantization_backend = "netsurf_bitcodec_v1"
injectable_parameters = ["kernels", "biases"]

[samples]
ranking_count = 2
empirical_count = 3
evaluation_count = 3
require_disjoint = true

[candidates]
strategy = "all"
count = 102
seed = 31001
score_quantiles = 4

[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "signed-gradient-times-exact-delta/v2"

[[estimators]]
name = "per_sample_first_order_magnitude"
implementation_version = "mean-absolute-per-example-gradient-times-exact-delta/v1"

[[estimators]]
name = "exact_diagonal_second_order"
implementation_version = "finite-difference-exact-diagonal/v1"

[[estimators]]
name = "hutchinson_diagonal_second_order"
implementation_version = "rademacher-hvp-diagonal/v1"
seed = 31002
probes = 32

[[estimators]]
name = "legacy_qpolargrad"
implementation_version = "recovered-dense-first-call/v1"

[[estimators]]
name = "clean_activation_qpolargrad"
implementation_version = "clean-dense-mean-cancelled/v1"

[[estimators]]
name = "uncancelled_activation_drift"
implementation_version = "clean-dense-mean-absolute/v1"

[protection]
coverages = []
mitigation_model = "perfect_event_suppression"

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probability = 0.0

[execution]
trials = 1
confidence = 0.95
fault_seed = 940000
permutation_seed = 941000

[output]
root = ""
report = true
plots = true

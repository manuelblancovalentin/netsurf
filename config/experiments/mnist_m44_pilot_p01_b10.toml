# NetSuRF M4.4 researcher-authored configuration (not an implementation change).
# Place in config/experiments/ to preserve checkpoint-relative paths.
# Validate via `netsurf validate config/experiments/mnist_m44_pilot_p01_b10.toml --resolved`.

schema_version = "4.4.0"
scientific_protocol = "factorized-guidance-ablation/v1"

[experiment]
name = "mnist_m44_pilot_p01_b10"
description = "Predeclared feasibility pilot for schema-4.4 controlled factorization ablation, 10% protected and logical BER 0.01."
objective = "Check controlled proposal equivalence, timing, candidate-identity diagnostics, and held-out conditional-risk measurement; pilot is not confirmatory."

[benchmark]
adapter = "mnist_quantized"
id = "mnist_dense32_q621-v2"
checkpoint = "../../workspace/benchmarks/mnist_quantized/checkpoint.npz"
dataset = "/ml/datasets/mnist/mnist.npz"
split = "v2_disjoint_partitions"
quantization = "q<6,2,1>"
quantization_backend = "netsurf_bitcodec_v1"
injectable_parameters = ["kernels", "biases"]

[samples]
ranking_count = 128
search_count = 64
final_count = 128
require_disjoint = true

[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "signed-gradient-times-exact-delta/v2"

[[guidance]]
name = "gradient_global"
estimator = "first_order_gradient_delta"
priority = ["estimator_score_desc", "stable_identity"]
weight = 1.0

[initial_mask]
guidance = "gradient_global"
budget_bits = 15270

[[methods]]
name = "static_gradient"
strategy = "static"
guidance = ["gradient_global"]
interaction_model = "none"
proposal_model = "gradient"
comparison_role = "static"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0

[[methods]]
name = "gradient_control"
strategy = "corrected_screening"
guidance = ["gradient_global"]
interaction_model = "none"
proposal_model = "gradient"
comparison_role = "controlled"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0

[[methods]]
name = "gradient_sign_enriched"
strategy = "corrected_screening"
guidance = ["gradient_global"]
interaction_model = "none"
proposal_model = "gradient_sign_enriched"
comparison_role = "controlled"
aggregate_shuffle_mode = "none"
sign_bit_weight = 3.0

[[methods]]
name = "exact_conditional_screening"
strategy = "corrected_screening"
guidance = ["gradient_global"]
interaction_model = "none"
proposal_model = "conditional_marginal"
comparison_role = "controlled"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0

[[methods]]
name = "dynamic_kronecker"
strategy = "factorized_screening"
guidance = ["gradient_global"]
interaction_model = "factorized_kronecker"
proposal_model = "kronecker"
comparison_role = "controlled"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0
aggregate_population = "full"
dynamic_aggregate = true

[[methods]]
name = "shuffled_kronecker_layer_bit"
strategy = "factorized_screening"
guidance = ["gradient_global"]
interaction_model = "factorized_kronecker"
proposal_model = "shuffled_kronecker"
comparison_role = "controlled"
aggregate_shuffle_mode = "layer_bit_position"
sign_bit_weight = 1.0
aggregate_population = "full"
dynamic_aggregate = true

[[methods]]
name = "stratified_kronecker"
strategy = "factorized_screening"
guidance = ["gradient_global"]
interaction_model = "factorized_stratified_kronecker"
proposal_model = "stratified_kronecker"
comparison_role = "controlled"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0
aggregate_population = "full"
dynamic_aggregate = true

[[methods]]
name = "uniform_control"
strategy = "corrected_screening"
guidance = ["gradient_global"]
interaction_model = "none"
proposal_model = "uniform"
comparison_role = "controlled"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0

[[methods]]
name = "conditional_greedy_reference"
strategy = "conditional_greedy"
guidance = ["gradient_global"]
interaction_model = "none"
proposal_model = "quality_reference"
comparison_role = "reference"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0
iterations = 1

[search]
evaluator = "incremental"
iterations = 6
candidate_pool_strategy = "top_union"
candidate_pool_count = 20000
uniform_exploration = 0.15
rank_temperature = 0.15
background_contexts = 8
seed = 48101
greedy_add_candidates = 4
greedy_remove_candidates = 3
initial_temperature = 0.01
cooling_rate = 0.95
cache_memory_mb = 256.0
exact_enumeration = false

[polar]
enabled = true
mode = "finite_background"
pair_budget = 96
background_contexts = 3
seed = 48102
strength = 0.75
collect_cancellation_diagnostics = true

[topology]
interaction_models = ["finite_polar", "topology_corrected", "kronecker", "stratified_kronecker", "factorized_kronecker", "factorized_stratified_kronecker"]
interaction_guidance = "mask_dependent_sparse_v1"
confidence_strata = 4
minimum_stratum_samples = 8
output_layer_pair_budget = 32
hidden_layer_pair_budget = 40
cross_layer_pair_budget = 24
cache_response_limit = 1024

[screening]
removal_shortlist = 4
addition_shortlist = 8
verification_shortlist = 4
refresh_frequency = 1
response_cache_limit = 1024
interaction_strength = 0.75

[proposal_control]
candidate_universe = "shared_candidate_pool"
verification_budget = 4
shared_backgrounds = true
enforce_equal_iterations = true

[factor_cache]
enabled = true
scope = "run"
vectorized_queries = true

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probabilities = [0.01]

[final_evaluation]
natural_contexts = 16
natural_seed = 48103
conditional_contexts = 32
conditional_seed = 48104
confidence = 0.95

[replications]
count = 4
search_seed_stride = 1000
final_seed_stride = 1000
sample_offset_stride = 0

[output]
root = ""
report = true
plots = true

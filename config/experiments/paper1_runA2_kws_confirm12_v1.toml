schema_version = "3.5.0"
scientific_protocol = "multi-coverage-protection/v1"

[experiment]
name = "paper1_runA2_kws_confirm12_v1"
description = "Run A2: larger DS-CNN confirmation. Seven static rankings on twelve 400-clip Speech Commands test windows in pinned order (clips 405*i to 405*i+399), each with its own 64-clip calibration draw (training clips 405*i to 405*i+63), rebuilt masks and new independent fault fields. Replication 0 reuses the calibration draw of the main grid and is reported separately. The test inputs were used before (main grid: clips 0-999; Run A: clips 0-3999); calibration draws 1-11, all masks built from them and all fault fields are new."
objective = "Estimate, with the replication as the unit, the paired error-rate and loss difference between the per-example absolute-gradient mask and every other measured ranking on the complete BER-by-budget grid. Pre-set decision rule (same as Run A): the default is confirmed for DS-CNN if the upper 95% bound of that difference over replications 1-11 is below one percentage point in every decision-useful cell of these data. Conditional on one frozen checkpoint; ideal logical suppression."


schema_version = "3.1.0"
scientific_protocol = "estimator-validation/v1"
policies = []

[experiment]
name = "mnist_estimator_uniform_bounded"
description = "Uniform without-replacement isolated-bit estimator comparison."
objective = "Compare mean, absolute per-example, positive per-example, and Hessian approximations on a uniform candidate sample."

[benchmark]
adapter = "mnist_quantized"
id = "mnist_dense32_q621-v1"
checkpoint = "../../workspace/benchmarks/mnist_quantized/checkpoint.npz"
dataset = "/ml/datasets/mnist/mnist.npz"
split = "m3_explicit_disjoint_partitions"
quantization = "q<6,2,1>"
quantization_backend = "netsurf_bitcodec_v1"
injectable_parameters = ["kernels", "biases"]

[samples]
ranking_count = 64
empirical_count = 64
evaluation_count = 128
require_disjoint = true

[candidates]
strategy = "uniform"
count = 96
seed = 32200
score_quantiles = 4

[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "signed-gradient-times-exact-delta/v2"

[[estimators]]
name = "per_sample_first_order_magnitude"
implementation_version = "mean-absolute-per-example-gradient-times-exact-delta/v1"

[[estimators]]
name = "per_sample_positive_damage"
implementation_version = "mean-positive-per-example-gradient-times-exact-delta/v1"

[[estimators]]
name = "hutchinson_diagonal_second_order"
implementation_version = "rademacher-hvp-diagonal/v1"
seed = 32201
probes = 4

[protection]
coverages = []
mitigation_model = "perfect_event_suppression"

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probability = 0.0

[execution]
trials = 1
confidence = 0.95
fault_seed = 952000
permutation_seed = 953000

[replications]
count = 1
candidate_seed_stride = 0
hutchinson_seed_stride = 0
sample_offset_stride = 0
fault_seed_stride = 0

[output]
root = ""
report = true
plots = true

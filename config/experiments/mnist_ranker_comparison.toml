schema_version = "2.0.0"
scientific_protocol = "quantized-weight-fault/v2"

[experiment]
name = "mnist_quantized_ranker_comparison"
description = "Paired comparison of established rankers on the modern quantized MNIST benchmark."
objective = "Compare MSB-first, random, and first-order gradient-delta masks under identical schedules."

[benchmark]
adapter = "mnist_quantized"
id = "mnist_dense32_q621-v1"
checkpoint = "../../workspace/benchmarks/mnist_quantized/checkpoint.npz"
dataset = "/ml/datasets/mnist/mnist.npz"
split = "v2_test_first_n"
evaluation_samples = 256
ranking_samples = 256
quantization = "q<6,2,1>"
quantization_backend = "netsurf_bitcodec_v1"
injectable_parameters = ["kernels", "biases"]

[[estimators]]
name = "msb_first"
implementation_version = "encoded-bit-index/v1"
policy = "global_ranking"
result_name = "msb_first"

[[estimators]]
name = "random"
implementation_version = "numpy-pcg64/v1"
policy = "global_ranking"
result_name = "random"

[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "abs-gradient-times-exact-delta/v1"
policy = "global_ranking"
result_name = "first_order_gradient_delta"

[protection]
coverage = 0.10
mitigation_model = "perfect_event_suppression"

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probability = 0.001

[execution]
trials = 12
confidence = 0.95
random_ranking_seed = 23011
fault_seed = 930000

[output]
root = ""
report = true
plots = true

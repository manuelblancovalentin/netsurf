schema_version = "3.5.0"
scientific_protocol = "multi-coverage-protection/v1"

[experiment]
name = "paper1_runA_kws_confirm_v1"
description = "Run A confirmation: seven static rankings plus a randomized within-tier significance control on four disjoint 1000-clip Speech Commands test windows in pinned order, each with its own 64-clip calibration draw and new independent fault fields. Replication 0 reuses the previously exposed official window 0-999; windows 1000-3999 were used earlier only in bounded six-bit conditional-selection studies."
objective = "Estimate paired error-rate and loss regret of the per-example absolute-gradient mask against every other measured mask on the complete BER-by-budget grid, with calibration draw, evaluation window and fault field varying jointly across replications; compare published-form FKeras within-tier selection with randomized within-tier selection at partial tiers. Conditional on one frozen checkpoint; ideal logical suppression."


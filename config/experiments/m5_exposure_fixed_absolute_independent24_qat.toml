# Follow-up M5 observational study; persistent faults, no training or pruning.
# p24 = p32 * 152700 / 114540: matches E[RAW XOR bit flips] across model sizes.
# Does NOT match active/unprotected bit count automatically.
# Researcher-authored M5 inference-only study. No pruning, fine-tuning, or search.
# p=0 provides CLEAN inference using the same held-out partition.
# Zero protected bits is not allowed in schema-4.4; this is NOT an unprotected-fault baseline.
# M4.4 static historical policy: absolute held-out fault risk; NOT search improvement.
# Separate config per policy because initial_mask.guidance alone fixes the static mask.
# Match the main M4.4 experiment natural fault schedules and dataset partitions.
schema_version = "4.4.0"
scientific_protocol = "factorized-guidance-ablation/v1"

[experiment]
name = "m5_exposure_fixed_absolute_independent24_qat"
description = "M5 fixed_absolute equal expected raw fault exposure, clean and persistent-fault study for independent24_qat; two protection fractions, three BER levels"
objective = "Measure clean accuracy and matched natural-fault loss/accuracy with a per-sample-magnitude static mask; no training or search. Compare architectures using clean-relative degradation."

[benchmark]
adapter = "mnist_quantized"
id = "mnist_m5_independent24_qat_q621"
checkpoint = "../../workspace/benchmarks/m5_independent24_qat/checkpoint.npz"
dataset = "/ml/datasets/mnist/mnist.npz"
split = "v2_disjoint_partitions"
quantization = "q<6,2,1>"
quantization_backend = "netsurf_bitcodec_v1"
injectable_parameters = ["kernels", "biases"]

[samples]
ranking_count = 128
search_count = 64
final_count = 2048
require_disjoint = true

[[estimators]]
name = "per_sample_first_order_magnitude"
implementation_version = "mean-absolute-per-example-gradient-times-exact-delta/v1"
seed = 0
probes = 16

[[guidance]]
name = "historical_policy"
estimator = "per_sample_first_order_magnitude"
priority = ["estimator_score_desc", "stable_identity"]
weight = 1.0

[initial_mask]
guidance = "historical_policy"
budget_bits_list = [7635, 15270]

[[methods]]
name = "static_per_sample_magnitude"
strategy = "static"
guidance = ["historical_policy"]
interaction_model = "none"
proposal_model = "gradient"
comparison_role = "static"
aggregate_shuffle_mode = "none"
sign_bit_weight = 1.0


[search]
evaluator = "incremental"
iterations = 0
candidate_pool_strategy = "top_union"
candidate_pool_count = 20000
uniform_exploration = 0.15
rank_temperature = 0.15
background_contexts = 8
seed = 539503
greedy_add_candidates = 4
greedy_remove_candidates = 3
initial_temperature = 0.01
cooling_rate = 0.95
cache_memory_mb = 256.0
exact_enumeration = false

[polar]
enabled = false
mode = "finite_background"
pair_budget = 0
background_contexts = 1
seed = 539504
strength = 0.75
collect_cancellation_diagnostics = false

[topology]
interaction_models = ["finite_polar"]
interaction_guidance = "mask_dependent_sparse_v1"
confidence_strata = 4
minimum_stratum_samples = 8
output_layer_pair_budget = 0
hidden_layer_pair_budget = 0
cross_layer_pair_budget = 0
cache_response_limit = 1024

[screening]
removal_shortlist = 4
addition_shortlist = 8
verification_shortlist = 6
refresh_frequency = 1
response_cache_limit = 1024
interaction_strength = 0.75

[proposal_control]
candidate_universe = "shared_candidate_pool"
verification_budget = 6
shared_backgrounds = true
enforce_equal_iterations = true

[factor_cache]
enabled = false
scope = "run"
vectorized_queries = true

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probabilities = [0.0, 0.0013333333333333333, 0.013333333333333333]

[final_evaluation]
natural_contexts = 32
natural_seed = 539501
conditional_contexts = 1
conditional_seed = 539502
confidence = 0.95

[replications]
count = 3
search_seed_stride = 1000
final_seed_stride = 1000
sample_offset_stride = 0

[output]
root = ""
report = true
plots = true

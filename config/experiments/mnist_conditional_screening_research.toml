schema_version = "4.3.0"
scientific_protocol = "mask-aware-conditional-screening/v1"

[experiment]
name = "mnist_conditional_screening_research"
description = "Researcher-run matched comparison of conditional screening and factorized proposal guidance across two logical BERs and two budgets."
objective = "Estimate natural-fault and independently held-out conditional-risk effects while separating search, fault, and replication variation; polar and factorized terms remain proposal diagnostics."

[benchmark]
adapter = "mnist_quantized"
id = "mnist_dense32_q621-v2"
checkpoint = "../../workspace/benchmarks/mnist_quantized/checkpoint.npz"
dataset = "/ml/datasets/mnist/mnist.npz"
split = "v2_disjoint_partitions"
quantization = "q<6,2,1>"
quantization_backend = "netsurf_bitcodec_v1"
injectable_parameters = ["kernels", "biases"]

[samples]
ranking_count = 128
search_count = 64
final_count = 128
require_disjoint = true

[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "signed-gradient-times-exact-delta/v2"

[[guidance]]
name = "gradient_global"
estimator = "first_order_gradient_delta"
priority = ["estimator_score_desc", "stable_identity"]
weight = 1.0

[initial_mask]
guidance = "gradient_global"
budget_bits_list = [7635, 15270]

[[methods]]
name = "static_gradient"
strategy = "static"
guidance = ["gradient_global"]
interaction_model = "none"

[[methods]]
name = "uniform_swap"
strategy = "uniform_swap"
guidance = ["gradient_global"]
interaction_model = "none"

[[methods]]
name = "marginal_screening"
strategy = "marginal_screening"
guidance = ["gradient_global"]
interaction_model = "none"
pair_correction = false

[[methods]]
name = "corrected_screening"
strategy = "corrected_screening"
guidance = ["gradient_global"]
interaction_model = "none"

[[methods]]
name = "dynamic_kronecker"
strategy = "factorized_screening"
guidance = ["gradient_global"]
interaction_model = "factorized_kronecker"
aggregate_population = "full"
dynamic_aggregate = true

[[methods]]
name = "dynamic_stratified_kronecker"
strategy = "factorized_screening"
guidance = ["gradient_global"]
interaction_model = "factorized_stratified_kronecker"
aggregate_population = "full"
dynamic_aggregate = true

[[methods]]
name = "finite_polar"
strategy = "polar_guided_swap"
guidance = ["gradient_global"]
interaction_model = "finite_polar"

[[methods]]
name = "hybrid_screening"
strategy = "hybrid_screening"
guidance = ["gradient_global"]
interaction_model = "factorized_kronecker"
aggregate_population = "full"
dynamic_aggregate = true
polar_correction_budget = 8

[[methods]]
name = "conditional_greedy"
strategy = "conditional_greedy"
guidance = ["gradient_global"]
interaction_model = "none"
iterations = 1

[search]
evaluator = "incremental"
iterations = 8
candidate_pool_strategy = "top_union"
candidate_pool_count = 20000
uniform_exploration = 0.15
rank_temperature = 0.15
background_contexts = 8
seed = 47501
greedy_add_candidates = 4
greedy_remove_candidates = 3
initial_temperature = 0.01
cooling_rate = 0.95
cache_memory_mb = 256.0
exact_enumeration = false

[polar]
enabled = true
mode = "finite_background"
pair_budget = 96
background_contexts = 3
seed = 47502
strength = 0.75
collect_cancellation_diagnostics = true

[topology]
interaction_models = ["finite_polar", "topology_corrected", "kronecker", "stratified_kronecker", "factorized_kronecker", "factorized_stratified_kronecker"]
interaction_guidance = "mask_dependent_sparse_v1"
confidence_strata = 4
minimum_stratum_samples = 8
output_layer_pair_budget = 32
hidden_layer_pair_budget = 40
cross_layer_pair_budget = 24
cache_response_limit = 1024

[screening]
removal_shortlist = 4
addition_shortlist = 8
verification_shortlist = 6
refresh_frequency = 1
response_cache_limit = 1024
interaction_strength = 0.75

[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probabilities = [0.001, 0.01]

[final_evaluation]
natural_contexts = 32
natural_seed = 47503
conditional_contexts = 32
conditional_seed = 47504
confidence = 0.95

[replications]
count = 3
search_seed_stride = 1000
final_seed_stride = 1000
sample_offset_stride = 0

[output]
root = ""
report = true
plots = true

# Exploratory fixed-cohort extension, frozen before its new fault outcomes.
# Zero/full controls are implicit and evaluated once per field.
schema_version = "3.5.0"
scientific_protocol = "multi-coverage-protection/v1"

[experiment]
name = "paper1_kws_common_grid_v2"
description = "Exploratory seven-policy common BER/budget grid on previously exposed fixed inputs; published-form FKeras only, four ranking-seed replications and 32 paired fields per BER."
objective = "Compare fixed masks under exact kernel INT8 Bernoulli faults; no new-input confirmation or physical reliability claim."
[benchmark]
adapter = "mlperf_tiny_kws_int8_v1"
id = "mlperf_tiny_kws_dscnn_int8_v1"
checkpoint = "/data/models/models--mlcommons--tiny/snapshots/4addd0fa08d216e20637637874e084895f289da4/benchmark/training/keyword_spotting/trained_models/kws_ref_model.tflite"
dataset = "/data/datasets/speech_commands/0.0.3"
asset_lock = "/projects/kona-assets/manuelbv/locks/mlperf-tiny/kws.lock.json"
inference_backend = "tensorflow_lite_builtin_ref_v1"
split = "official_subset_1000"
quantization = "tflite_affine_int8"
quantization_backend = "tflite_affine_integer_v1"
injectable_parameters = ["kernels"]
[samples]
ranking_count = 64
empirical_count = 1
evaluation_count = 1000
require_disjoint = true
[candidates]
strategy = "uniform"
count = 16
seed = 970101
score_quantiles = 1
[[estimators]]
name = "random"
implementation_version = "seeded-uniform-score/v1"
seed = 110301
[[estimators]]
name = "numerical_bit_jump"
implementation_version = "absolute-affine-xor-jump/v1"
[[estimators]]
name = "msb_first"
implementation_version = "relative-word-bit-index/v1"
[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "signed-gradient-times-exact-delta/v2"
[[estimators]]
name = "per_sample_first_order_magnitude"
implementation_version = "mean-absolute-per-example-gradient-times-exact-delta/v1"
[[estimators]]
name = "per_sample_positive_damage"
implementation_version = "mean-positive-per-example-gradient-times-exact-delta/v1"
[[estimators]]
name = "fkeras_paper"
implementation_version = "fkeras-paper-continuous-kws/v1"
seed = 970201
hessian = {eigenpairs = 2, max_iterations = 100, max_products = 300, tolerance = 0.00001, ordering = "largest_magnitude_signed"}
[[policies]]
name = "random"
estimator = "random"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true
[[policies]]
name = "numerical_bit_jump"
estimator = "numerical_bit_jump"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true
[[policies]]
name = "msb_first"
estimator = "msb_first"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true
[[policies]]
name = "first_order_gradient_delta"
estimator = "first_order_gradient_delta"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true
[[policies]]
name = "per_sample_first_order_magnitude"
estimator = "per_sample_first_order_magnitude"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true
[[policies]]
name = "per_sample_positive_damage"
estimator = "per_sample_positive_damage"
priority = ["estimator_score_desc", "stable_identity"]
prespecified = true
[[policies]]
name = "fkeras_paper"
estimator = "fkeras_paper"
priority = ["bit_significance_desc", "estimator_score_desc", "stable_identity"]
prespecified = true
[protection]
coverages = [0.0625, 0.125, 0.1875, 0.25]
probabilities = [0.0001, 0.001, 0.003, 0.01]
mitigation_model = "perfect_event_suppression"
[fault]
target = "weight"
location = "logical_trainable_parameter_bits"
persistence = "persistent_trial"
distribution = "independent_bernoulli"
probability = 0.0001
[execution]
trials = 8
confidence = 0.95
fault_seed = 1103101
permutation_seed = 1105101
[replications]
count = 4
candidate_seed_stride = 0
hutchinson_seed_stride = 0
sample_offset_stride = 0
fault_seed_stride = 100003
estimator_seed_stride = 1009
[output]
root = ""
report = true
plots = false

schema_version = "3.6.0"
scientific_protocol = "multi-coverage-protection/v1"

[experiment]
name = "paper1_runK_resnet8_pruned_s07_v2"
description = "Run K: the seven static rankings of the main study on a different trained ResNet-8 checkpoint (pruned_s0.7), same architecture and conversion recipe as the pinned model, eight 1000-image CIFAR-10 test windows (0-7999, used before), two fault fields per BER each with their own calibration draws, rebuilt masks and new fault fields."
objective = "Test whether the ranking comparison of the pinned checkpoint carries over to a checkpoint that is pruned, under-trained or retrained from another seed. Pre-set reading: the absolute-gradient mask is counted as broken on this checkpoint if another ranking is better by at least one accuracy point in a decision-useful cell with a Holm-adjusted field-level p below 0.05; MSB-first and FKeras regrets are compared with the pinned checkpoint. Exploratory; ideal logical suppression."

[benchmark]
adapter = "mlperf_tiny_ic_int8_v1"
id = "mlperf_tiny_ic_resnet8_int8_v1"
checkpoint = "/projects/netsurf/manuelbv/workspace/implementation-worktrees/paper1-tecs-revision-v1/workspace/runs/paper1_runJ_resnet8_variants_v1/pruned_s0.7/trained_quant.tflite"
dataset = "/data/datasets/cifar10/cifar-10-python.tar.gz"
asset_lock = "/projects/kona-assets/manuelbv/locks/mlperf-tiny/ic.lock.json"
inference_backend = "tensorflow_lite_builtin_ref_v1"
split = "test"
quantization = "tflite_affine_int8"
quantization_backend = "tflite_affine_integer_v1"
injectable_parameters = ["kernels"]

[samples]
ranking_count = 64
empirical_count = 1
evaluation_count = 1000
require_disjoint = true

[candidates]
strategy = "uniform"
count = 1
seed = 3121101
score_quantiles = 1

[[estimators]]
name = "random"
implementation_version = "seeded-uniform-score/v1"
result_name = "random_reference"
seed = 7401102

[[estimators]]
name = "msb_first"
implementation_version = "relative-word-bit-index/v1"
result_name = "s2_msb_first"

[[estimators]]
name = "numerical_bit_jump"
implementation_version = "absolute-affine-xor-jump/v1"
result_name = "s3_numerical_jump"

[[estimators]]
name = "first_order_gradient_delta"
implementation_version = "signed-gradient-times-exact-delta/v2"
result_name = "s4_gradient_delta"

[[estimators]]
name = "per_sample_first_order_magnitude"
implementation_version = "mean-absolute-per-example-gradient-times-exact-delta/v1"

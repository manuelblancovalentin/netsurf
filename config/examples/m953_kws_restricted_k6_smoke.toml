schema_version = "6.1.0"
scientific_protocol = "exact-conditional-protection/v2"

[experiment]
name = "m953_kws_restricted_k6_smoke"
description = "Bounded same-distribution KWS restricted-subcube smoke with six fixed candidate bits."
objective = "Validate exact restricted mask selection on model-selection data and paired transfer to untouched-by-selection final data."

[benchmark]
adapter = "mlperf_tiny_kws_int8_v1"
id = "mlperf-tiny/kws"
checkpoint = "/data/models/models--mlcommons--tiny/snapshots/4addd0fa08d216e20637637874e084895f289da4/benchmark/training/keyword_spotting/trained_models/kws_ref_model.tflite"
dataset = "/data/datasets/speech_commands/0.0.3"
asset_lock = "/projects/kona-assets/manuelbv/locks/mlperf-tiny/kws.lock.json"
inference_backend = "tensorflow_lite_builtin_ref_v1"
split = "full_test_4890"
quantization = "int8_tflite_affine"
quantization_backend = "tflite_affine_integer_v1"
injectable_parameters = ["kernels"]

[samples]
calibration_role = "conditional_calibration"
calibration_count = 4
calibration_offset = 0
model_selection_role = "conditional_model_selection"
model_selection_count = 4
model_selection_offset = 0
evaluation_role = "conditional_final_evaluation"
